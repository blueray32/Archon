<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Glow effect -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="brainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4ecdc4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Brain outline with neural pathways -->
  <g filter="url(#glow)">
    <!-- Left hemisphere -->
    <path d="M 180 120
             Q 140 130, 120 160
             Q 100 190, 105 230
             Q 108 260, 120 290
             Q 130 320, 145 350
             Q 155 370, 170 390
             Q 185 400, 200 400
             Q 215 400, 230 390
             Q 235 370, 235 350
             L 235 250
             Q 235 200, 220 160
             Q 210 140, 190 125
             Z"
          stroke="url(#brainGradient)"
          stroke-width="3"
          fill="none"
          opacity="0.9"/>

    <!-- Right hemisphere -->
    <path d="M 332 120
             Q 372 130, 392 160
             Q 412 190, 407 230
             Q 404 260, 392 290
             Q 382 320, 367 350
             Q 357 370, 342 390
             Q 327 400, 312 400
             Q 297 400, 282 390
             Q 277 370, 277 350
             L 277 250
             Q 277 200, 292 160
             Q 302 140, 322 125
             Z"
          stroke="url(#brainGradient)"
          stroke-width="3"
          fill="none"
          opacity="0.9"/>

    <!-- Central connection (corpus callosum) -->
    <line x1="235" y1="280" x2="277" y2="280"
          stroke="url(#brainGradient)"
          stroke-width="2.5"
          opacity="0.8"/>

    <!-- Neural pathways - Left hemisphere -->
    <path d="M 150 180 Q 170 200, 180 230"
          stroke="url(#brainGradient)"
          stroke-width="1.5"
          fill="none"
          opacity="0.7"/>
    <path d="M 140 220 Q 160 240, 170 270"
          stroke="url(#brainGradient)"
          stroke-width="1.5"
          fill="none"
          opacity="0.7"/>
    <path d="M 145 260 Q 165 280, 175 310"
          stroke="url(#brainGradient)"
          stroke-width="1.5"
          fill="none"
          opacity="0.7"/>
    <path d="M 160 300 Q 180 320, 190 350"
          stroke="url(#brainGradient)"
          stroke-width="1.5"
          fill="none"
          opacity="0.7"/>

    <!-- Neural pathways - Right hemisphere -->
    <path d="M 362 180 Q 342 200, 332 230"
          stroke="url(#brainGradient)"
          stroke-width="1.5"
          fill="none"
          opacity="0.7"/>
    <path d="M 372 220 Q 352 240, 342 270"
          stroke="url(#brainGradient)"
          stroke-width="1.5"
          fill="none"
          opacity="0.7"/>
    <path d="M 367 260 Q 347 280, 337 310"
          stroke="url(#brainGradient)"
          stroke-width="1.5"
          fill="none"
          opacity="0.7"/>
    <path d="M 352 300 Q 332 320, 322 350"
          stroke="url(#brainGradient)"
          stroke-width="1.5"
          fill="none"
          opacity="0.7"/>

    <!-- Cerebellum (lower back part) -->
    <ellipse cx="256" cy="395" rx="40" ry="25"
             stroke="url(#brainGradient)"
             stroke-width="2.5"
             fill="none"
             opacity="0.8"/>

    <!-- Neural nodes/synapses (glowing dots) -->
    <circle cx="165" cy="200" r="3" fill="#00d4ff" opacity="0.9"/>
    <circle cx="155" cy="240" r="3" fill="#4ecdc4" opacity="0.9"/>
    <circle cx="160" cy="280" r="3" fill="#00d4ff" opacity="0.9"/>
    <circle cx="175" cy="330" r="3" fill="#4ecdc4" opacity="0.9"/>

    <circle cx="347" cy="200" r="3" fill="#00d4ff" opacity="0.9"/>
    <circle cx="357" cy="240" r="3" fill="#4ecdc4" opacity="0.9"/>
    <circle cx="352" cy="280" r="3" fill="#00d4ff" opacity="0.9"/>
    <circle cx="337" cy="330" r="3" fill="#4ecdc4" opacity="0.9"/>

    <!-- Central cortex folds -->
    <path d="M 245 180 Q 256 170, 267 180"
          stroke="url(#brainGradient)"
          stroke-width="1.5"
          fill="none"
          opacity="0.6"/>
    <path d="M 245 220 Q 256 210, 267 220"
          stroke="url(#brainGradient)"
          stroke-width="1.5"
          fill="none"
          opacity="0.6"/>
    <path d="M 245 260 Q 256 250, 267 260"
          stroke="url(#brainGradient)"
          stroke-width="1.5"
          fill="none"
          opacity="0.6"/>
    <path d="M 245 300 Q 256 290, 267 300"
          stroke="url(#brainGradient)"
          stroke-width="1.5"
          fill="none"
          opacity="0.6"/>
  </g>
</svg>
