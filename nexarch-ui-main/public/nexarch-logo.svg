<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cyberpunk glow effects -->
    <filter id="cyberGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Electric gradients -->
    <linearGradient id="electricCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff00ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#cc00ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9900ff;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="hotPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff0080;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff00ff;stop-opacity:1" />
    </linearGradient>

    <!-- Radial burst -->
    <radialGradient id="coreBurst" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8" />
      <stop offset="30%" style="stop-color:#00ffff;stop-opacity:0.6" />
      <stop offset="70%" style="stop-color:#ff00ff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#0000ff;stop-opacity:0" />
    </radialGradient>
  </defs>

  <g filter="url(#cyberGlow)">
    <!-- Central core - Neural nexus point -->
    <circle cx="120" cy="120" r="18"
            fill="url(#coreBurst)"
            opacity="0.9">
      <animate attributeName="r" values="18;22;18" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Outer core ring -->
    <circle cx="120" cy="120" r="20"
            stroke="url(#electricCyan)"
            stroke-width="3"
            fill="none"
            opacity="1">
      <animateTransform attributeName="transform"
                        type="rotate"
                        from="0 120 120"
                        to="360 120 120"
                        dur="8s"
                        repeatCount="indefinite"/>
    </circle>

    <!-- Main structure - Hexagonal architecture with "N" form -->
    <!-- Left vertical of N -->
    <path d="M 60 60 L 70 55 L 70 125 L 60 130 Z"
          stroke="url(#electricCyan)"
          stroke-width="2.5"
          fill="url(#electricCyan)"
          fill-opacity="0.2"/>

    <!-- Diagonal of N -->
    <path d="M 70 125 L 80 130 L 170 55 L 160 50 Z"
          stroke="url(#neonPurple)"
          stroke-width="2.5"
          fill="url(#neonPurple)"
          fill-opacity="0.2"/>

    <!-- Right vertical of N -->
    <path d="M 170 55 L 180 60 L 180 130 L 170 125 Z"
          stroke="url(#hotPink)"
          stroke-width="2.5"
          fill="url(#hotPink)"
          fill-opacity="0.2"/>

    <!-- Neural network nodes connecting to center -->
    <!-- Top nodes -->
    <circle cx="90" cy="50" r="5" fill="#00ffff" opacity="1">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="40" r="5" fill="#ff00ff" opacity="1">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="50" r="5" fill="#00ffff" opacity="1">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.9s" repeatCount="indefinite"/>
    </circle>

    <!-- Side nodes -->
    <circle cx="40" cy="90" r="5" fill="#ff0080" opacity="1">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="90" r="5" fill="#ff0080" opacity="1">
      <animate attributeName="opacity" values="1;0.5;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>

    <circle cx="40" cy="150" r="5" fill="#9900ff" opacity="1">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="150" r="5" fill="#9900ff" opacity="1">
      <animate attributeName="opacity" values="1;0.6;1" dur="2.0s" repeatCount="indefinite"/>
    </circle>

    <!-- Bottom nodes -->
    <circle cx="90" cy="190" r="5" fill="#00d4ff" opacity="1">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="190" r="5" fill="#00d4ff" opacity="1">
      <animate attributeName="opacity" values="1;0.7;1" dur="2.7s" repeatCount="indefinite"/>
    </circle>

    <!-- Connection lines from nodes to center -->
    <line x1="90" y1="50" x2="120" y2="120" stroke="url(#electricCyan)" stroke-width="1.5" opacity="0.6"/>
    <line x1="120" y1="40" x2="120" y2="120" stroke="url(#neonPurple)" stroke-width="1.5" opacity="0.6"/>
    <line x1="150" y1="50" x2="120" y2="120" stroke="url(#electricCyan)" stroke-width="1.5" opacity="0.6"/>
    <line x1="40" y1="90" x2="120" y2="120" stroke="url(#hotPink)" stroke-width="1.5" opacity="0.6"/>
    <line x1="200" y1="90" x2="120" y2="120" stroke="url(#hotPink)" stroke-width="1.5" opacity="0.6"/>
    <line x1="40" y1="150" x2="120" y2="120" stroke="url(#neonPurple)" stroke-width="1.5" opacity="0.6"/>
    <line x1="200" y1="150" x2="120" y2="120" stroke="url(#neonPurple)" stroke-width="1.5" opacity="0.6"/>
    <line x1="90" y1="190" x2="120" y2="120" stroke="url(#electricCyan)" stroke-width="1.5" opacity="0.6"/>
    <line x1="150" y1="190" x2="120" y2="120" stroke="url(#electricCyan)" stroke-width="1.5" opacity="0.6"/>

    <!-- Outer hexagonal architecture ring -->
    <path d="M 120 30 L 190 70 L 190 170 L 120 210 L 50 170 L 50 70 Z"
          stroke="url(#electricCyan)"
          stroke-width="3"
          fill="none"
          opacity="0.8"
          stroke-dasharray="8 4">
      <animateTransform attributeName="transform"
                        type="rotate"
                        from="0 120 120"
                        to="-360 120 120"
                        dur="20s"
                        repeatCount="indefinite"/>
    </path>

    <!-- Inner rotating energy rings -->
    <circle cx="120" cy="120" r="45"
            stroke="url(#neonPurple)"
            stroke-width="2"
            fill="none"
            opacity="0.5"
            stroke-dasharray="4 8">
      <animateTransform attributeName="transform"
                        type="rotate"
                        from="0 120 120"
                        to="360 120 120"
                        dur="4s"
                        repeatCount="indefinite"/>
    </circle>

    <circle cx="120" cy="120" r="60"
            stroke="url(#hotPink)"
            stroke-width="2"
            fill="none"
            opacity="0.4"
            stroke-dasharray="6 6">
      <animateTransform attributeName="transform"
                        type="rotate"
                        from="0 120 120"
                        to="-360 120 120"
                        dur="6s"
                        repeatCount="indefinite"/>
    </circle>

    <!-- Data flow particles -->
    <circle r="3" fill="#00ffff">
      <animateMotion dur="4s" repeatCount="indefinite"
                     path="M 120 30 L 190 70 L 190 170 L 120 210 L 50 170 L 50 70 Z"/>
    </circle>
    <circle r="3" fill="#ff00ff">
      <animateMotion dur="4s" begin="1s" repeatCount="indefinite"
                     path="M 120 30 L 190 70 L 190 170 L 120 210 L 50 170 L 50 70 Z"/>
    </circle>
    <circle r="3" fill="#ff0080">
      <animateMotion dur="4s" begin="2s" repeatCount="indefinite"
                     path="M 120 30 L 190 70 L 190 170 L 120 210 L 50 170 L 50 70 Z"/>
    </circle>

    <!-- Corner accent nodes -->
    <circle cx="120" cy="30" r="6" stroke="url(#electricCyan)" stroke-width="2" fill="none" opacity="0.9"/>
    <circle cx="190" cy="70" r="6" stroke="url(#neonPurple)" stroke-width="2" fill="none" opacity="0.9"/>
    <circle cx="190" cy="170" r="6" stroke="url(#hotPink)" stroke-width="2" fill="none" opacity="0.9"/>
    <circle cx="120" cy="210" r="6" stroke="url(#electricCyan)" stroke-width="2" fill="none" opacity="0.9"/>
    <circle cx="50" cy="170" r="6" stroke="url(#neonPurple)" stroke-width="2" fill="none" opacity="0.9"/>
    <circle cx="50" cy="70" r="6" stroke="url(#hotPink)" stroke-width="2" fill="none" opacity="0.9"/>

    <!-- Energy pulse waves from center -->
    <circle cx="120" cy="120" r="30"
            stroke="#00ffff"
            stroke-width="2"
            fill="none"
            opacity="0">
      <animate attributeName="r" values="30;80;30" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="120" r="30"
            stroke="#ff00ff"
            stroke-width="2"
            fill="none"
            opacity="0">
      <animate attributeName="r" values="30;80;30" begin="1.5s" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" begin="1.5s" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
