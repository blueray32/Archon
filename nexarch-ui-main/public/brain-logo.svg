<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Enhanced glow effects -->
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Multiple colorful gradients -->
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f3ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f43f5e;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="rainbow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#00f3ff;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </radialGradient>
  </defs>

  <g filter="url(#strongGlow)">
    <!-- Left hemisphere with colorful outline -->
    <path d="M 55 35
             C 40 38, 30 50, 26 68
             C 22 85, 26 105, 32 125
             C 38 142, 48 155, 62 160
             C 70 154, 75 145, 75 132
             L 75 70
             C 75 52, 68 40, 58 35
             Z"
          stroke="url(#cyan)"
          stroke-width="4"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.95"/>

    <!-- Right hemisphere with colorful outline -->
    <path d="M 145 35
             C 160 38, 170 50, 174 68
             C 178 85, 174 105, 168 125
             C 162 142, 152 155, 138 160
             C 130 154, 125 145, 125 132
             L 125 70
             C 125 52, 132 40, 142 35
             Z"
          stroke="url(#purple)"
          stroke-width="4"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.95"/>

    <!-- Central connection (corpus callosum) -->
    <line x1="75" y1="100" x2="125" y2="100"
          stroke="url(#pink)"
          stroke-width="4"
          stroke-linecap="round"
          opacity="0.9"/>
    <line x1="78" y1="110" x2="122" y2="110"
          stroke="url(#teal)"
          stroke-width="3"
          stroke-linecap="round"
          opacity="0.8"/>
    <line x1="80" y1="90" x2="120" y2="90"
          stroke="url(#blue)"
          stroke-width="3"
          stroke-linecap="round"
          opacity="0.8"/>

    <!-- Neural pathways - Left hemisphere (colorful) -->
    <path d="M 42 60 Q 55 75, 60 95"
          stroke="url(#cyan)"
          stroke-width="2.5"
          fill="none"
          opacity="0.85"/>
    <path d="M 38 85 Q 50 100, 55 120"
          stroke="url(#teal)"
          stroke-width="2.5"
          fill="none"
          opacity="0.85"/>
    <path d="M 40 105 Q 52 120, 58 140"
          stroke="url(#blue)"
          stroke-width="2.5"
          fill="none"
          opacity="0.85"/>
    <path d="M 50 125 Q 60 138, 65 152"
          stroke="url(#purple)"
          stroke-width="2.5"
          fill="none"
          opacity="0.85"/>

    <!-- Neural pathways - Right hemisphere (colorful) -->
    <path d="M 158 60 Q 145 75, 140 95"
          stroke="url(#purple)"
          stroke-width="2.5"
          fill="none"
          opacity="0.85"/>
    <path d="M 162 85 Q 150 100, 145 120"
          stroke="url(#pink)"
          stroke-width="2.5"
          fill="none"
          opacity="0.85"/>
    <path d="M 160 105 Q 148 120, 142 140"
          stroke="url(#cyan)"
          stroke-width="2.5"
          fill="none"
          opacity="0.85"/>
    <path d="M 150 125 Q 140 138, 135 152"
          stroke="url(#teal)"
          stroke-width="2.5"
          fill="none"
          opacity="0.85"/>

    <!-- Additional inner pathways for complexity -->
    <path d="M 60 70 Q 70 85, 72 100"
          stroke="url(#pink)"
          stroke-width="1.8"
          fill="none"
          opacity="0.7"/>
    <path d="M 140 70 Q 130 85, 128 100"
          stroke="url(#cyan)"
          stroke-width="1.8"
          fill="none"
          opacity="0.7"/>

    <!-- Synaptic nodes with different colors -->
    <circle cx="50" cy="72" r="3.5" fill="#00f3ff" opacity="1">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="45" cy="95" r="3.5" fill="#a855f7" opacity="1">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="48" cy="118" r="3.5" fill="#ec4899" opacity="1">
      <animate attributeName="opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="58" cy="142" r="3.5" fill="#14b8a6" opacity="1">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.2s" repeatCount="indefinite"/>
    </circle>

    <circle cx="150" cy="72" r="3.5" fill="#8b5cf6" opacity="1">
      <animate attributeName="opacity" values="1;0.5;1" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="155" cy="95" r="3.5" fill="#f43f5e" opacity="1">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="152" cy="118" r="3.5" fill="#00d4ff" opacity="1">
      <animate attributeName="opacity" values="1;0.5;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="142" cy="142" r="3.5" fill="#06b6d4" opacity="1">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.1s" repeatCount="indefinite"/>
    </circle>

    <!-- Central nodes on connections -->
    <circle cx="85" cy="100" r="3" fill="#ec4899" opacity="1">
      <animate attributeName="opacity" values="1;0.6;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="100" r="4" fill="#00f3ff" opacity="1">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="115" cy="100" r="3" fill="#a855f7" opacity="1">
      <animate attributeName="opacity" values="1;0.6;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <!-- Cerebellum (larger and more colorful) -->
    <ellipse cx="100" cy="158" rx="22" ry="12"
             stroke="url(#rainbow)"
             stroke-width="3.5"
             fill="none"
             opacity="0.95"/>
    <path d="M 82 158 Q 100 152, 118 158"
          stroke="url(#pink)"
          stroke-width="2"
          fill="none"
          opacity="0.8"/>

    <!-- Central cortex folds (more detailed and colorful) -->
    <path d="M 85 55 Q 100 48, 115 55"
          stroke="url(#cyan)"
          stroke-width="2.2"
          fill="none"
          opacity="0.8"/>
    <path d="M 85 75 Q 100 68, 115 75"
          stroke="url(#purple)"
          stroke-width="2.2"
          fill="none"
          opacity="0.8"/>
    <path d="M 85 115 Q 100 108, 115 115"
          stroke="url(#teal)"
          stroke-width="2.2"
          fill="none"
          opacity="0.8"/>
    <path d="M 85 135 Q 100 128, 115 135"
          stroke="url(#blue)"
          stroke-width="2.2"
          fill="none"
          opacity="0.8"/>

    <!-- Additional decorative pathways -->
    <path d="M 65 50 Q 72 58, 78 68"
          stroke="url(#pink)"
          stroke-width="1.5"
          fill="none"
          opacity="0.6"/>
    <path d="M 135 50 Q 128 58, 122 68"
          stroke="url(#cyan)"
          stroke-width="1.5"
          fill="none"
          opacity="0.6"/>
  </g>
</svg>
