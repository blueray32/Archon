<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="neonBrain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4ecdc4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f3ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <g filter="url(#neonGlow)">
    <!-- Simplified brain outline -->
    <!-- Left hemisphere -->
    <path d="M 42 30
             C 32 32, 26 40, 24 50
             C 22 60, 24 72, 28 84
             C 32 92, 38 98, 48 100
             C 52 96, 54 90, 54 82
             L 54 52
             C 54 42, 50 34, 44 30
             Z"
          stroke="url(#neonBrain)"
          stroke-width="2.5"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Right hemisphere -->
    <path d="M 86 30
             C 96 32, 102 40, 104 50
             C 106 60, 104 72, 100 84
             C 96 92, 90 98, 80 100
             C 76 96, 74 90, 74 82
             L 74 52
             C 74 42, 78 34, 84 30
             Z"
          stroke="url(#neonBrain)"
          stroke-width="2.5"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Connection -->
    <line x1="54" y1="66" x2="74" y2="66"
          stroke="url(#neonBrain)"
          stroke-width="2"
          stroke-linecap="round"/>

    <!-- Neural pathways -->
    <path d="M 35 48 Q 42 56, 45 68"
          stroke="url(#neonBrain)"
          stroke-width="1.5"
          fill="none"
          opacity="0.8"/>
    <path d="M 93 48 Q 86 56, 83 68"
          stroke="url(#neonBrain)"
          stroke-width="1.5"
          fill="none"
          opacity="0.8"/>

    <!-- Synaptic nodes -->
    <circle cx="40" cy="55" r="2" fill="#00d4ff" opacity="0.9"/>
    <circle cx="36" cy="72" r="2" fill="#4ecdc4" opacity="0.9"/>
    <circle cx="88" cy="55" r="2" fill="#00d4ff" opacity="0.9"/>
    <circle cx="92" cy="72" r="2" fill="#4ecdc4" opacity="0.9"/>

    <!-- Cerebellum -->
    <ellipse cx="64" cy="98" rx="12" ry="7"
             stroke="url(#neonBrain)"
             stroke-width="2"
             fill="none"
             opacity="0.9"/>

    <!-- Central folds -->
    <path d="M 58 45 Q 64 40, 70 45"
          stroke="url(#neonBrain)"
          stroke-width="1.2"
          fill="none"
          opacity="0.7"/>
    <path d="M 58 60 Q 64 55, 70 60"
          stroke="url(#neonBrain)"
          stroke-width="1.2"
          fill="none"
          opacity="0.7"/>
    <path d="M 58 75 Q 64 70, 70 75"
          stroke="url(#neonBrain)"
          stroke-width="1.2"
          fill="none"
          opacity="0.7"/>
  </g>
</svg>
