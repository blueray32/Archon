name: Supabase Cleanup

on:
  schedule:
    - cron: "0 3 * * *" # Daily at 03:00 UTC
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies for cleanup script
        run: python -m pip install --upgrade pip python-dotenv requests

      - name: Run Supabase cleanup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MAX_SOURCES: "2000"
          MAX_CHUNKS_PER_SOURCE: "400"
          MAX_PRP_DOCS: "2000"
          MAX_VERSIONS_PER_DOC: "5"
        run: python scripts/supabase_cleanup_rest.py
