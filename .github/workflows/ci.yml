name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ "*" ]

jobs:
  backend-lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Ruff (lint)
        run: |
          ruff check python/src || (echo "Ruff errors found" && exit 1)

      - name: MyPy (type-check, non-blocking)
        run: |
          mypy python/src || echo "MyPy issues (non-blocking)"

  frontend-biome:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps (frontend)
        working-directory: archon-ui-main
        run: |
          npm ci

      - name: Biome CI
        working-directory: archon-ui-main
        run: |
          npm run biome:ci

